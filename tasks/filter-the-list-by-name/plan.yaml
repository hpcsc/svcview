# Generated by decompose-to-deliverables. Each deliverable is one reviewable change.
# deliver-story reads this to scaffold worktrees and launch implement-flow per wave.
# Delivery is trunk: each deliverable lands on main before the next one starts, with no pull request.
# The story is one deliverable: 5 tasks, about 5 weighted files (4 Full, 1 Low), and about 11 raw files. Full:
# internal/tui/screen.go, internal/tui/screen_test.go, docs/cli.md and internal/config/action.go (only the comment of
# keysOfSvcview, which says today that / is kept for the filter). Low: the new e2e/tests/filter.test.ts. The other raw
# files are golden files in internal/tui/testdata and count 0: four new ones (the open filter line, a filtered list in
# groups, no service matches, a kept filter), and keys.golden and keys-with-actions.golden, which show the help. No
# other golden file changes, because the filter line shows only while a filter is open or kept.
# It completes all 6 criteria, 3 more than the rule allows. They are the rules of one filter of one list: the line and
# the keys that go into it (5), the list after each key (1, 2), the text of an empty result (6), and the two ends of
# the filter, enter (3) and esc (4). Three cut lines fail:
# - By key (/, the keys that type text, the filtered list and esc in Tasks 1 to 3, then enter with ↑ and ↓ in Task 4
#   and the docs): the second part is 2 tasks, under 5. Both parts change Update, press, helpLine, helpText,
#   keys.golden and the Keys table of docs/cli.md. The first part alone gives the user of the screen a filter that
#   esc can only clear, so the third criterion has no way to be reached.
# - By what the user sees (the filter line and the keys that go into it in Task 1, then the list that follows it):
#   the first part shows a line that takes each key and changes nothing in the list, and the user of the screen
#   reaches it with /. Each part is under 5 tasks.
# - By layer (the screen, then docs/cli.md): the docs part is 1 task that changes no behaviour, and the keys part alone
#   leaves keys that docs/cli.md does not describe (tasks/learnings.md, "Each key of the screen goes into the help and
#   docs/cli.md").
# In trunk mode no person reviews a deliverable alone, and this one breaks no sizing rule that a cut would fix: 5
# tasks, about 5 weighted files, one aggregate (tui.Screen), no domain event, and no new type.
# The deliverable has blast_radius high. Task 1 makes the open filter line the guard in front of s (a start with no
# confirmation), x and r with y, and the keys of actions with no confirm: a key that leaks past it acts on launchd or
# runs a command on a typed word, for example proxy holds r, o, x and then y, so a leak stops the selected service.
# Task 4 lets these keys act again on the selection that the filter decides, so a mistake acts on a service that the
# list does not show. The tests of both press each printable ASCII key, or each key that acts, with the start, the
# stop and the restart recorded. Nothing outside the screen changes: no launchctl command, no config setting, and no
# text from outside.
# Certainty is medium: the confirmation (a state that takes each key), the message line (a line that shows only while
# it has a text) and selectedAfterRead (the place of a gone name) are the precedents. No precedent covers text that
# the user types, a help line that follows the state of the screen, or rows of the list other than the rows of the
# read, while the status runs and the header counts keep each row.
# Design choices, for the plan gate:
# - No new type. The filter is two fields of tui.Screen, the filter and whether the filter line is open. rows gives
#   the rows that the list shows, so each method of the list, the selection and the keys that act follow the filter
#   with no change; runStatuses takes each row of the read, so a hidden service keeps its status runs.
# - The words: filter, filter line, open, keep, clear, contains. Not match, which is the regular expression of a
#   group; not focus, which is the pane that the arrows act on; not confirm, which is the setting of an action; not
#   command line, which is the program and its arguments of an action.
# Choices that the story leaves open, for the plan gate:
# - The filter line shows under the panes, or under the help, and above the message line, while the line is open and
#   while a filter is kept. It shows / and the filter, with a cursor after the filter only while the line is open. The
#   panes are one line shorter while it shows. svcview cuts it at the width of the terminal with ….
# - While the filter line is open, each key that types text goes into the filter: each letter, digit, sign and the
#   space, so h j k l, q, ?, /, s, x, r, o, y and each key of an action too. backspace deletes the last character,
#   enter keeps the filter, esc clears it and closes the line, ctrl+c quits, and each other key does nothing: ↑, ↓,
#   tab, ← and → too, so a service is selected only after enter. A paste does not go into the filter.
# - While the filter line is open, the help line shows enter keep the filter · esc clear the filter, because each key
#   of the usual help line types text then. The help that ? shows lists / after h, then enter and backspace, and esc
#   reads hide this help, or clear the filter.
# - / moves the focus to the list, so that ↑ and ↓ select a service after enter. / does nothing while the help shows,
#   and answers no while a confirmation shows. / with a kept filter opens the line again with the kept filter.
# - The filter compares with the full name of a service, the launchd label, and not only with the short name that a
#   row shows: example shows each row of com.example.…. An empty filter shows each service.
# - The selected service stays selected while the list shows it. When the filter hides it, the row at its place in the
#   order of the list is selected, as after a read where the selected service is gone. After esc, the service that was
#   selected in the filtered list stays selected.
# - no service matches shows when the filter has text and the name of no service of the read contains it, also when
#   the read has no services. With no filter, a read with no services shows an empty list, as today. A read error shows
#   the error whatever the filter.
# - enter on an empty filter line closes it, as esc does. enter does nothing while the filter line is not open.
# - While the help shows over a kept filter, esc hides only the help; the next esc clears the filter.
# - The header counts each service of the read, also each service that the filter hides. A hidden service keeps its
#   status runs.
