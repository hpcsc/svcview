# Delivery is trunk: each deliverable lands on main before the next one starts, with no pull request.
# The story is one deliverable: 7 tasks, about 10 weighted files (6 Full, 4 Low), and about 11 raw files. Full:
# internal/status/command.go, internal/config/group.go, internal/config/config_test.go, internal/tui/screen.go,
# internal/tui/screen_test.go and docs/cli.md. Low: the new internal/status/command_template.go,
# internal/status/command_template_test.go, internal/config/action.go and e2e/tests/actions.test.ts. The other raw
# file is one new golden file of the help with actions in internal/tui/testdata; no golden file that exists changes,
# because the help line of a group with no actions stays the same. internal/status/command_test.go counts Full if a
# test asserts the error text of a text that defines a template; with it the count is 11.
# It completes all 6 criteria, 3 more than the rule allows. Criterion 6 is the docs of the other five, and criteria
# 1 to 4 are rules of one key of a group: the setting that defines it and the help line that names it, the command
# that it gives the terminal to, its confirmation, and its failure of a template value. Three cut lines fail:
# - By layer (the shared texts of a command, the read of actions and the keys that an action cannot take, then the
#   help line, the key and the confirmation): today svcview refuses actions as a setting that it does not know
#   (internal/config/config_test.go:544-545). The config part alone accepts, checks and ignores the actions of a file
#   in conf.d, so the author of a config file, an actor that exists today (G4), gets a setting that does nothing. The
#   state is reachable, so the two parts must land together. Each part is 3 tasks, under 5.
# - By criterion (an action with no confirm in Tasks 1 to 5, then confirm and the docs): the second part is 2 tasks,
#   which change the same branch of the screen and the same tests as the first, and nothing in them stands alone.
# - By what the user sees (the help line with the keys in Tasks 1 to 4, then the keys that act): the first part shows
#   L worker log in the help line for a key that does nothing, and the user of the screen reaches it.
# In trunk mode no person reviews a deliverable alone, and this one breaks no sizing rule that a cut would fix: 7
# tasks, about 10 weighted files, one aggregate (config.Group and its actions), and no domain event.
# The deliverable has blast_radius high: Task 5 runs a command that a config file names, with the template values of
# the selected service, on one key press, and Task 6 changes the confirmation that guards the stop, the restart and
# each action with confirm: true, so a mistake runs a command, a stop or a restart on a no.
# Certainty is medium: readStatus in internal/config, o and giveTerminalTo in internal/tui, and the confirmation of x
# and r are the precedents. No precedent covers a group that is no longer comparable, a help line that follows the
# selected service, or a y that gives the terminal to a program in the foreground.
# Design choices, for the plan gate:
# - The texts of a command and their checks move out of status.Command into a new status.CommandTemplate, with
#   Apply(service) giving the command line or the failure of a template value, and status.Command and config.Action
#   each hold one. The other way, an action that holds a status.Command, gives an action an every and a timeout that
#   it never uses.
# - config.Group gets Actions as a list, so it is no longer comparable. This drops the rule "a group stays comparable"
#   of the planned design of US-003: the screen tells groups apart by name in its two places that compare groups
#   (internal/tui/screen.go:292 and :337). Names are unique across all config files, and Other is refused as a name.
# - The word action now covers what any key does to the selected service, as the proposal uses it for the actions on
#   launchd and the actions of a group; actionOn, actionEnded and actionNotEnded in internal/tui stay the actions on
#   launchd that run in the background.
# Choices that the story leaves open, for the plan gate:
# - A key is one character that prints and that is not a space, and the case counts: L is not l. Names of keys such
#   as ctrl+l, f2, enter, tab or space are refused.
# - The keys of svcview that an action cannot take are each one-character key that the screen handles today
#   (? h j k l o q r s x) and /, which the proposal gives to the filter of the list (US-012), so that a config that
#   works now does not stop at start when the filter lands. y is not a key of svcview: it answers a confirmation only
#   while one shows, and an action can take it.
# - An error in actions names the action by its place, for example action 2 of group "Workers"; the error of two
#   actions with one key also gives the line of the first. confirm takes only true or false: yaml.v3 reads yes as a
#   text, and svcview refuses it.
# - The help line puts the keys of the group of the selected service after o log and before ? help, in the order of
#   the file, and ? lists them after o. A service of another group, of Other, or no selected service shows the help
#   line of today.
# - The key of an action acts as o does: in each state of the service, also while a start, a stop or a restart of it
#   has not ended; nothing while the help shows, with no rows, or while the list shows a read error; no while a
#   confirmation shows. On a service of another group, the key does nothing and shows nothing.
# - svcview applies the template values when the key is pressed. A missing value shows on the message line, for
#   example the plist has no WORKER_LOG, and svcview asks no confirmation then, also with confirm: true. y runs the
#   command line that the key made.
# - The confirmation reads Run <name> for <service>? (y/N), for example Run worker log for com.example.worker.01?
#   (y/N). y runs the command, ctrl+c quits, and each other key answers no.
# - A failure of the command shows on the message line with the words of o: <command line> exited with code N,
#   <command line> ended by SIGx, or run <command line>: <error>.
# - svcview status reads the actions, so an error in them stops it as each other config error does; it shows and
#   runs no action. The e2e tests use the action of the proposal, [less, +F, '{{.Env.WORKER_LOG}}'], with the fake
#   less that exists, so no new fake program is needed.
