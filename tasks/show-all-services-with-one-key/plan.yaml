# How the screen reads the new list after a: at once, not at the next refresh. Task 2 makes a change the services that
# the next read reads; Task 3 makes a start that read at once. When a read runs at a, the screen reads the new services
# as soon as that read ends, and the rows of that read do not show. One read runs at a time, because
# launchd.Domain must not read from two goroutines at the same time (internal/launchd/domain.go:12), and the screen
# keeps one chain of refreshes, one refresh after each read ends, so each a adds at most one read.
# The deliverable has blast_radius high. Task 1 decides which read the screen calls at start, so a mistake shows each
# service of macOS with no --all. Task 2 puts each service of macOS under s, x and r with one key, and x on a service
# with no plist runs launchctl bootout, after which svcview cannot start the service again until the next login. Task 2
# also changes what a config file can hold: a config.yaml, or a file of conf.d that another program wrote, with an
# action on a worked before and now stops svcview at start. The keys and their confirmations do not change, x still
# asks Stop <name>? (y/N), the mark follows the rows on the screen so the header and the list cannot disagree, and the
# tests record each call of each read.
# Certainty is medium: / became a key of svcview the same way (press, helpText, keysOfSvcview and the screen test that
# ties them), showScreen already picks the read (internal/cli/root.go:77-80), and the refresh keeps one read at a time
# today (internal/tui/screen.go:160-183, screen_test.go:918-937). No instance starts a read outside the chain of
# refreshes, so Task 3 is low: it decides how one read at a time and one chain of refreshes hold when a key starts a
# read, and a tick of Bubble Tea cannot be stopped.
# Design choices, for the plan gate:
# - No new type. tui.Screen gets the read of all services beside the read of the services with a plist, and which of
#   the two it asks for. tui.NewScreen takes both reads and the choice at start, so showScreen gives it
#   Domain.Services, Domain.AllServices and --all in place of one read. The message servicesRead says which services
#   it read.
# - The words: all (as Domain.AllServices and --all), services with a plist, mark (as the stale mark of a status), and
#   change. Not toggle, switch, mode, system service or macOS service.
# Choices that the story leaves open, for the plan gate:
# - The mark follows the rows on the screen, not the key: the header shows · all after the domain while the rows come
#   from a read of all services. Between a and the end of the new read, the old rows and their header show. Before
#   the first read ends, the header shows the domain alone, also with --all. A read of all services that fails shows
#   the error and the mark.
# - The mark is · all after the domain, at the right of the top border of the header, in the default color. svcview
#   cuts the title svcview first and cuts neither the domain nor all, so the border keeps the width of the terminal
#   from 19 columns.
# - While the help shows, a does nothing, as /, tab, h and l do. While a confirmation shows, a answers no. While the
#   filter line is open, a goes into the filter.
# - The help that ? shows lists a after backspace and before s, with show all services, or only the services with a
#   plist. The help line at the bottom of the screen does not show a, as it does not show /.
# - A in upper case is not a key of svcview, and an action can take it.
# - a starts no status run: a service that a adds gets its first run at the next every of its group, as a service that
#   a refresh adds. A service that a shows again shows the status of its last run until its group runs again.
# - a does not change the filter, the focus or the setting refresh. No config setting sets the services at start.
