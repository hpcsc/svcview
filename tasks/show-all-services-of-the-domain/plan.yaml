# weighted files, one aggregate (launchd.Domain), no domain event, and no new type.
# The deliverable has blast_radius high. Task 2 decides which read the screen uses, so a mistake puts each service of
# macOS (523 of the 554 names that launchctl list printed on the planning Mac) under s, x and r without --all. x on a
# service with no plist runs launchctl bootout; launchctl list then does not print the service, so it leaves the list,
# and svcview cannot start it again until the next login. The keys themselves do not change; Task 1 only reads.
# Certainty is high: Domain.Services (internal/launchd/domain.go:21-48) is the same read with the same join, the bool
# flags of svcview update (internal/cli/update.go:24-28) are the precedent of a flag, and showScreen already gives the
# screen its read (internal/cli/root.go:72). The screen, the groups and the template values need no change.
# Design choices, for the plan gate:
# - One new method, launchd.Domain.AllServices, beside Services; no new type. The root command gives the screen
#   AllServices or Services as its read, and svcview status keeps Services.
# - The words: all, and service with no plist. Not system service or macOS service: svcview cannot tell whether macOS
#   or another program owns a service with no plist (for example sh.brew or com.openssh on the planning Mac).
# Choices that the story leaves open, for the plan gate:
# - The flag is --all, with no short form, the usage "show each service that launchctl list prints, also the services
#   of macOS", and no default value in the help, as --help and --version show none. It is a flag of the root command
#   only (Local in urfave/cli v3, whose flags are persistent by default): svcview status --all <name> fails with the
#   error of a flag that the command does not define. svcview status finds only a service that has a plist.
# - No setting of a config file turns --all on, and the screen shows no mark that --all is on. The header counts each
#   service of the read.
# - No text changes for a service with no plist: a template value that it does not have gives the plist has no X, the
#   plist has no StandardOutPath, the plist has no StandardErrorPath or the service has no plist, and o gives <name> has
#   no log path in its plist.
# - The keys act on a service with no plist as on any other service in its state: s runs kickstart (it is loaded) or
#   nothing (it is running), x runs bootout after Stop <name>? (y/N), and r runs kickstart -k. The alternative, a
#   confirmation of x that says that svcview cannot start the service again, or a refusal of x on a service with no
#   plist, is not in the story; docs/cli.md says what x does to such a service.
# - A group whose match takes services with no plist runs its status command for each of them, with no limit.
