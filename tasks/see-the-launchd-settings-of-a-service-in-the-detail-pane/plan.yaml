# Delivery plan for: See the launchd settings of a service in the detail pane
# Generated by decompose-to-deliverables. Each deliverable is one reviewable change.
# deliver-story reads this to scaffold worktrees and launch implement per wave.
# Delivery is trunk: each deliverable lands on main before the next one starts, with no pull request.
# The story is one deliverable: 6 tasks, about 12 weighted files (7 Full, 5 Low), and about 15 raw files. Full:
# internal/service/service.go, internal/launchd/plist.go, internal/launchd/domain.go, internal/launchd/domain_test.go,
# internal/tui/screen.go, internal/tui/screen_test.go and docs/cli.md. Low: the new e2e/tests/plist.test.ts, and four
# new fixtures in internal/launchd/testdata (an XML plist with the program and the paths, an XML plist with KeepAlive,
# and one plist with each property of the story as XML and as binary). The other raw files count 0: the golden files
# plist.golden and plist-wrapped.golden, which go test -update writes, and confirmation.golden, whose selected service
# has a plist path and so gains the line Plist. A run that puts the texts of the conditions and of the start times in a
# new file of internal/launchd adds 1 Low, to 13.
# It completes all 6 criteria, 3 more than the rule allows. Three cut lines fail:
# - By what the pane answers: what launchd runs and where it logs (criteria 1, 3, 4 and 5: Tasks 1 to 3), then when
#   launchd starts the service (criterion 2: Tasks 4 and 5). Each part has 3 or 4 tasks with its half of the docs,
#   under 5. Criteria 5 and 6 split across both parts, and the second part changes only internal/launchd, because the
#   screen draws each property the same way, so it shows nothing on the screen that the first part did not draw.
# - By package (service.Property and the read in internal/launchd, then the screen): the first part changes nothing
#   that a person sees, and its groundwork is small (one type of two fields, one field of service.Service), so it ships
#   with its first reader, the detail pane.
# - By the continued lines (Task 3 alone): 1 task that completes no criterion of the story.
# In trunk mode no person reviews a deliverable alone, and this one breaks no sizing rule that a cut would fix: about
# 12 weighted files, one aggregate (the plist of a service, which internal/launchd reads and tui.Screen draws), no
# domain event, and one new type, service.Property.
# Certainty is medium: Tasks 1 to 5 each have a precedent and vary it - the plist read with its check of the type of
# each value (internal/launchd/plist.go:24-43) for Tasks 1, 4 and 5, the blocks of lines of the status in detailText
# (internal/tui/screen.go:775-838) for Task 2, and the wrap of a read error at the width of the list
# (internal/tui/screen.go:674-681) for Task 3. Task 6 is high. A probe of howett.net/plist v1.0.1 fixed how it decodes
# booleans, integers (uint64, or int64 when negative), arrays and dictionaries from XML and from binary, so no task
# is low.
# The deliverable has blast_radius high, for Tasks 1 and 2: a value of EnvironmentVariables can be a token or a
# password, and these tasks decide that only its name reaches the screen. The planned design gives the screen the
# names only (service.Property), the screen does not read Service.Env for the detail pane, and a unit test and an e2e
# test check that the value of a variable shows nowhere on the screen. Tasks 3 to 6 change text on the screen only: no
# key, no write, and no call of launchctl other than list.
# Where the lines of the plist show, for the plan gate: after the last line of the status (the last event, the last
# field, or the last line of a failure), or right after the data from launchd when no line of the status shows, with an
# empty line and then Plist with the plist path. The status is the part of the pane that changes, and a person reads it
# at each look at a worker; the plist changes only when someone edits it. At 80x24 the detail pane has 18 lines, and a
# plist with a program, two log paths and an environment takes 10 to 14 of them at 80 columns, so above the status it
# would push the fields of a worker out of the pane. A service with no status command, which is each service of Other
# and each service with no plist that --all adds, shows the plist right under its last exit. The proposal lists the
# plist before the fields ("the data from launchd, the settings of its plist, the fields of its status, and its
# events"); the plan departs from that order for the reason above. To take the order of the proposal, Task 2 puts the
# block above the line Status, and no other task changes.
# How a person reads a condition of KeepAlive, for the plan gate: as a plain phrase in the words of the screen, not as
# the raw key. The name of each line is the plist property in plain words (keep alive for KeepAlive, run at load for
# RunAtLoad), so a person finds the property in the plist, and docs/cli.md maps each line and each phrase to its
# property. SuccessfulExit true shows "when the last exit is 0" and false "when the last exit is not 0", Crashed shows
# "when the last exit is a crash" or "is not a crash", PathState shows "while <path> exists" or "does not exist", and
# OtherJobEnabled shows "while <name> is loaded or running" or "is not loaded". "last exit" is the word of the pane two
# lines above, so a red "last exit 1" over "keep alive    when the last exit is 0" says why launchd leaves the service
# stopped. NetworkState, and each other condition such as AfterInitialDemand, shows its name with yes or no: launchd no
# longer acts on NetworkState (man launchd.plist), and a phrase would say that it does.
# Other choices that the story leaves open, for the plan gate:
# - The lines, in this order, each only when the plist has the property: Plist, program, work folder, run at load,
#   keep alive, start every, start at, watch paths, throttle, stdout, stderr, environment. The names are in the column
#   of the screen from the first cell, and the values in the column of PID and last exit (14 cells).
# - A boolean shows yes or no, also when it is false, because the plist has it. svcview shows what the plist says, not
#   what launchd infers from it (KeepAlive implies RunAtLoad) or a default that the plist does not state.
# - StartInterval and ThrottleInterval show their seconds with s (300s, the unit of the plist), not the two units of
#   the uptime (5m0s).
# - Each argument of the program, each condition, each start time, each watched path and each name of the environment
#   is on a line of its own in the column of the values, so an argument with a space in it stays one part. The names of
#   the environment are sorted, and their values never show.
# - A start time shows HH:MM with * for a missing hour or minute, then "on <weekday>", "on day <n>", or "on <weekday> or
#   on day <n>", then "in <month>": 09:00 on Monday, *:30, 00:00 on day 1 in June.
# - A part of a value that is wider than the room after the column continues on the next lines (Task 3). At 80 columns
#   the room is 30 cells, and a plist path such as /Users/<name>/Library/LaunchAgents/com.example.worker.plist is about
#   60, so a cut would hide the name of the file. The lines of the launchd data and of the status keep the cut with ….
#   To keep the cut for the plist too, drop Task 3; Task 6 then describes the cut.
# - A value whose type launchd does not take for its property is left out, as the environment and the log paths are
#   today. svcview does not check the range of a number or whether a path exists.
# - The code calls an entry of the plist a property, the word of the proposal for an entry in a plist, because setting
#   is the word of an entry of a config file (config.Settings). The story says settings of the plist.
