name: CI

on:
  push: {}

permissions:
  contents: read

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Mise install
        uses: jdx/mise-action@v5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run shellcheck
        run: task test:shellcheck

      - name: Build
        run: go build ./...

      - name: Run Unit Test
        run: task test:unit

      - name: Run vulnerabilities check
        run: task test:vulnerabilities

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run E2E Test
        run: task test:e2e

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      # The release notes start at the previous release, or at the first commit, and not at a prerelease tag.
      - name: Find the previous release
        id: previous
        run: |
          previous=$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V |
            awk -v current="$GITHUB_REF_NAME" '$0 == current { print previous; exit } { previous = $0 }')
          echo "tag=${previous:-$(git rev-list --max-parents=0 HEAD | tail -n 1)}" >> "$GITHUB_OUTPUT"

      # The commit of the tag also has a prerelease tag, and GoReleaser takes the higher tag unless it gets this one.
      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}

  prerelease:
    if: github.ref == 'refs/heads/main'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # one prerelease job at a time, so two runs do not tag and prune together
    concurrency:
      group: prerelease
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      # The tag is the next patch after the latest release, the run number and
      # the commit, for example v0.2.1-42.g4829f92. The g keeps a sha of digits
      # from starting with 0, which semver does not allow. A tag that this job
      # pushes with GITHUB_TOKEN starts no workflow, so the job release does not run for it.
      # update --prerelease installs the prerelease that was published last, so an older
      # commit must not publish after a newer one.
      - name: Tag the commit
        id: tag
        run: |
          head=$(git ls-remote --exit-code origin refs/heads/main)
          if [ "${head%%[[:space:]]*}" != "$GITHUB_SHA" ]; then
            echo "main has a newer commit, so this run publishes no prerelease"
            exit 0
          fi
          latest=$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
          major=${major#v}
          tag="v${major}.${minor}.$((patch + 1))-${GITHUB_RUN_NUMBER}.g$(git rev-parse --short=7 HEAD)"
          git tag "$tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Release
        if: steps.tag.outputs.tag != ''
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.tag }}

      - name: Keep the 5 newest prereleases of main
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName,isPrerelease,publishedAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-[0-9]+\\.g[0-9a-f]+$")))]
                  | sort_by(.publishedAt) | reverse | .[5:] | .[].tagName' |
            while read -r tag; do
              gh release delete "$tag" --cleanup-tag --yes
            done
