version: '3'

tasks:
  unit:
    cmds:
      - gotestsum --format pkgname-and-test-fails -- -tags=unit -race -cover -covermode=atomic -coverprofile=coverage-unit.out {{.CLI_ARGS}} ./...

  shellcheck:
    cmds:
      - find ./scripts -type f -name '*.sh' | xargs shellcheck -S error
      - shellcheck -S error ./hooks/*

  vulnerabilities:
    cmds:
      - govulncheck ./...
